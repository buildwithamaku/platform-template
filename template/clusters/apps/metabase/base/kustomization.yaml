# Metabase base — the env-neutral pieces. Overlays add the per-env Ingress host
# and the oauth2-proxy redirect URL.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metabase
resources:
  - namespace.yaml
  - metadata-deny.yaml
  - metabase-db.yaml
  - oauth-externalsecret.yaml
  - deployment.yaml
  - service.yaml
  - oauth2-proxy.yaml
