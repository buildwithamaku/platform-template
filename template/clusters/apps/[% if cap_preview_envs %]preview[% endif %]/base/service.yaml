# Per-PR preview Service — fronts the backend Deployment. Namespace-agnostic
# (destination.namespace places it per-PR).
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 80
      targetPort: http
