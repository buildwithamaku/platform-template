# ─────────────────────────────────────────────────────────────────────────────
# Platform factory template — the per-client questionnaire (Phase 8).
#
# `copier copy gh:buildwithamaku/platform-template <client>-platform` renders a
# full platform repo from the answers below. The refclient is reproduced by the
# committed answers file (refclient.copier-answers.yml); client #2 is a new one.
#
# Rendered files live under `template/` (_subdirectory), so this repo's root stays
# the "template meta" (this file, docs, the template's own CI) — not something a
# cluster ever reconciles.
# ─────────────────────────────────────────────────────────────────────────────
_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja

# Template vars are [< var >] (blocks [% %], comments [# #]) so copier NEVER
# collides with GitHub Actions ${{ }}, shell [[ ]] tests, or Go/Helm/ESO {{ }}.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[<"
  variable_end_string: ">]"
  comment_start_string: "[#"
  comment_end_string: "#]"

# Never stamp these into a client repo: build/state artifacts and the refclient's
# own local secrets. (copier does not read .gitignore.) terraform.tfvars is
# per-client + secret — the client fills it from terraform.tfvars.example.
_exclude:
  - "copier.yml"
  - "~*"
  - ".git"
  - ".DS_Store"
  - "**/node_modules"
  - "**/.terraform"
  - "**/terraform.tfstate*"
  - "**/terraform.tfvars"
  - "**/.gen"
  - "tofu/live/*/kubeconfig" # the GENERATED kubeconfig file — exact path so it can't
    # match the module's kubeconfig.tf (some copier versions glob "**/kubeconfig" onto it).
  - "**/backend.hcl" # per-client state backend config; only backend.hcl.example ships

# ── Identity ────────────────────────────────────────────────────────────────
client_name:
  type: str
  help: Short client slug — lowercase, used in cluster names, k8s labels, Infisical path
  validator: >-
    [% if not (client_name | regex_search('^[a-z][a-z0-9-]{1,30}$')) %]
    must be lowercase alphanumeric/hyphen, starting with a letter
    [% endif %]

domain:
  type: str
  help: Primary domain (e.g. acme.com). Apps served at <sub>.<domain>; admin UIs on the tailnet.

registry_org:
  type: str
  help: GitHub/GHCR org that hosts the platform repo + app images
  default: "[< client_name >]"

platform_repo:
  type: str
  help: Name of the client's platform repo (ArgoCD reconciles it). refclient's is "platform-template".
  default: "[< client_name >]-platform"

acme_email:
  type: str
  help: Email for the Let's Encrypt ACME account (per client — it's an identity, not a label)

# ── Cloud / infra ───────────────────────────────────────────────────────────
cloud:
  type: str
  help: >-
    Cloud provider. hetzner = self-managed k3s HA (cluster-k3s); digitalocean =
    managed DOKS control plane + node pools (cluster-doks).
  choices: [hetzner, digitalocean]
  default: hetzner

region:
  type: str
  help: Region/location (hetzner nbg1|fsn1|hel1 · digitalocean fra1|nyc1|ams3 · ...)
  default: nbg1

k8s_version:
  type: str
  help: DOKS Kubernetes version prefix (digitalocean only; e.g. "1.31." picks the latest 1.31 patch)
  default: "1.31."
  when: "[< cloud == 'digitalocean' >]"

# ── Reference apps (asked before node sizing: Metabase needs a bigger staging node)
app_backend:
  type: bool
  default: true
app_frontend:
  type: bool
  help: >-
    Web frontend. Renders a Deployment/Service + per-env Ingress at
    app[.staging].<domain>, its own ghcr pull secret, and staging/prod overlays.
    Image = ghcr.io/<org>/<client>-frontend (build with build-and-bump language:node).
    Browser API calls hit the backend's public ingress (api.<domain>), so any
    build-time public API URL is baked at build. Serving mode = frontend_type.
  default: false

frontend_type:
  type: str
  help: >-
    How the frontend image serves. static = built assets behind nginx
    (Vite/CRA/Angular/Vue, or Next `output: export`) — unprivileged nginx on :8080,
    no Node runtime; the common case. ssr = a Node server ($PORT) for server-side
    rendering (Next.js `output: standalone`, Nuxt, Remix, SvelteKit-node).
  choices: [static, ssr]
  default: static
  when: "[< app_frontend >]"
app_metabase:
  type: bool
  help: BI — Metabase read-only on prod data
  default: true

staging_node_type:
  type: str
  help: >-
    Staging node instance type. Metabase needs >= 16GB (Phase-7 proved cpx22/4GB
    OOMs the stack), so the default is cpx42 when Metabase is on. Run
    scripts/hetzner-server-types.sh <region> to confirm it's sold there.
  default: "[% if app_metabase %]cpx42[% else %]cpx22[% endif %]"

prod_node_type:
  type: str
  help: Prod node instance type
  default: cpx32

prod_node_count:
  type: int
  help: Prod nodes (3 = embedded-etcd HA)
  default: 3

gpu:
  type: bool
  help: Provision a GPU node pool (managed cloud only — Hetzner has ~none)
  default: false

gpu_node_size:
  type: str
  help: DOKS GPU droplet size for the GPU pool (e.g. gpu-h100x1-80gb). Asked only when gpu=true on DigitalOcean.
  default: "gpu-h100x1-80gb"
  when: "[< gpu and cloud == 'digitalocean' >]"

r2_account_id:
  type: str
  help: Cloudflare R2 account id (for the Postgres backup bucket endpoint). Bucket = <client>-pg-backups.
  default: ""

# ── Repos ───────────────────────────────────────────────────────────────────
repo_layout:
  type: str
  help: App code layout (build/CI only — the platform repo is identical either way, D-10)
  choices: [polyrepo, monorepo]
  default: polyrepo

# ── Build toolchain ─────────────────────────────────────────────────────────
# One place per language. Threaded into build-and-bump (app CI build/test), the
# e2e workflow + e2e runner image, and — by convention — the client's app
# Dockerfile, so the CI toolchain and the runtime base never drift. Bump per
# client by changing the answer; a fresh stamp inherits a current default.
node_version:
  type: str
  help: >-
    Node major used for the app CI build (language:node) and the Playwright e2e
    image. Match your app Dockerfile's base. Node 20 is EOL (Apr 2026); 24 is the
    current LTS, 22 the previous.
  default: "24"
go_version:
  type: str
  help: Go version for the app CI build (language:go) — used by actions/setup-go.
  default: "1.25"

# ── Capability matrix (proven components you toggle on — grows over time) ────
# HOW a capability renders conditionally: each cap_* component ships as files
# whose NAME embeds the toggle — e.g.
#   template/clusters/platform/[% if cap_event_bus %]72-nats.yaml[% endif %].jinja
# When the toggle is false the filename renders to the empty string and copier
# SKIPS the file entirely (verified under this repo's [< >] envops). This beats
# wrapping a file's body in [% if %] (which would emit an empty manifest that
# still lands in clusters/platform/). CI coverage: examples/all-caps.copier-answers.yml
# turns the built caps on so template-ci renders + kubeconforms their manifests.
cap_preview_envs:
  type: bool
  help: Per-PR ephemeral environments (ArgoCD ApplicationSet PR generator) — Railway-migrant favourite
  default: false
cap_service_mesh:
  type: bool
  help: mTLS + traffic policy between services (Linkerd) — for real microservices
  default: false
cap_event_bus:
  type: bool
  help: Async messaging (NATS)
  default: false
cap_vector_db:
  type: bool
  help: pgvector on the app DB (nearly free — a CNPG extension), or a dedicated store
  default: false
cap_model_serving:
  type: bool
  help: Model serving (vLLM/KServe) — implies gpu on a managed cloud
  default: false

# ── Platform choices (see phase-8-copier-decisions) ─────────────────────────
vpn:
  type: str
  help: Private admin access backend. tailscale=SaaS; headscale/netbird=self-hosted (no per-seat).
        NOTE switching from tailscale changes the auth model (pre-auth keys vs OAuth).
  choices: [tailscale, headscale, netbird]
  default: tailscale

idp:
  type: str
  help: SSO provider for oauth2-proxy (admin UIs / BI) — generic OIDC either way
  choices: [google, microsoft, okta, github, none]
  default: google

db_source:
  type: str
  help: Product DB — in-cluster CloudNativePG, or managed DO Managed Postgres. Same DATABASE_URL contract.
  choices: [cnpg, do-managed]
  default: cnpg

prod_profile:
  type: bool
  help: Enable prod hardening (Loki->object storage + retention, Valkey password, tightened
        API firewall, ...) — see prod-hardening-deferred
  default: false
