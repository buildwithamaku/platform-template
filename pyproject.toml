[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-factory-cli"
version = "0.1.0"
description = "Onboarding and diagnostics for the platform factory"
requires-python = ">=3.10"
dependencies = ["copier>=9,<10", "PyYAML>=6,<7"]

[project.scripts]
factory = "factory_cli.cli:main"

[tool.setuptools.packages.find]
include = ["factory_cli*"]
