# Reusable delivery workflow (D-06/D-10). App repos call this via workflow_call:
# it builds+tests+scans+pushes the image, then (as the buildwithamaku-deployer
# GitHub App) commits the image-tag bump to this platform repo's staging overlay.
# App repos NEVER touch a cluster; every deploy is an explicit git commit here.
name: build-and-bump

on:
  workflow_call:
    inputs:
      app:
        description: "overlay dir under clusters/apps/<app>/overlays/staging"
        required: true
        type: string
      image:
        description: "ghcr image repo, e.g. ghcr.io/buildwithamaku/refclient-backend"
        required: true
        type: string
      platform_repo:
        required: false
        type: string
        default: buildwithamaku/platform-template
    secrets:
      deployer_app_id:
        required: true
      deployer_private_key:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: gitleaks (blocking secret scan)
        run: |
          V=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./... && go test ./...
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ inputs.image }}:${{ steps.tag.outputs.tag }}

  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: apptoken
        with:
          app-id: ${{ secrets.deployer_app_id }}
          private-key: ${{ secrets.deployer_private_key }}
          owner: buildwithamaku
          repositories: platform-template
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform_repo }}
          token: ${{ steps.apptoken.outputs.token }}
      - name: Install kustomize
        run: |
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
      - name: Bump staging image tag
        run: |
          cd "clusters/apps/${{ inputs.app }}/overlays/staging"
          kustomize edit set image "${{ inputs.image }}=${{ inputs.image }}:${{ needs.build.outputs.tag }}"
      - name: Commit the deploy (staging is hands-off)
        run: |
          git config user.name "${{ steps.apptoken.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.apptoken.outputs.app-slug }}[bot]@users.noreply.github.com"
          git commit -am "deploy(${{ inputs.app }}): staging -> ${{ needs.build.outputs.tag }}"
          git push
