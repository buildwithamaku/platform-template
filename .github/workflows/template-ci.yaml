# CI for the TEMPLATE repo itself (the client-facing workflows live under
# template/.github and are stamped, not run here). Three guards:
#   1. gitleaks — block secrets/state from ever entering this (public-bound) repo
#      [the control that would have caught the kubeconfig/tfvars/backend.hcl leak].
#   2. render — `copier copy` the refclient answers must succeed.
#   3. kubeconform — the rendered manifests + overlays must validate, so template
#      reproducibility can't silently rot.
name: template-ci

on:
  pull_request:
  push:
    branches: [main]

env:
  SCHEMA: 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks (blocking secret scan)
        run: |
          V=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact --exit-code 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet copier

      - name: Render both cloud variants + the caps-on fixture
        run: |
          copier copy --data-file refclient.copier-answers.yml --defaults --trust \
            --vcs-ref HEAD . /tmp/render            # hetzner (cluster-k3s), all caps OFF
          copier copy --data-file examples/digitalocean.copier-answers.yml --defaults --trust \
            --vcs-ref HEAD . /tmp/render-do         # digitalocean (cluster-doks), all caps OFF
          copier copy --data-file examples/all-caps.copier-answers.yml --defaults --trust \
            --vcs-ref HEAD . /tmp/render-caps       # built capability components turned ON (frontend_type=ssr)
          copier copy --data-file examples/frontend-static.copier-answers.yml --defaults --trust \
            --vcs-ref HEAD . /tmp/render-fe         # frontend_type=static (the DEFAULT mode)
          copier copy --data-file examples/baremetal.copier-answers.yml --defaults --trust \
            --vcs-ref HEAD . /tmp/render-byo        # baremetal (cluster-k3s-byo, bring-your-own-nodes)

      - name: No stale copier vars (both renders)
        # Catches a half-converted template file (a {{ }} left after the [< >]
        # switch) — invisible to kubeconform (valid YAML / inside a shell script).
        # The var list is DERIVED from copier.yml keys, so adding a question
        # auto-extends the guard. Matches VAR NAMES only, so ESO/Go {{ .x }} and
        # Alertmanager {{ range }} are not false positives.
        run: |
          vars=$(grep -E '^[a-z][a-zA-Z0-9_]*:' copier.yml | sed 's/:.*//' | paste -sd '|' -)
          echo "guarding: $vars"
          if grep -rnE "\{\{ *($vars)" /tmp/render /tmp/render-do /tmp/render-caps /tmp/render-fe /tmp/render-byo; then
            echo "::error::stale {{ copier-var }} in a render — a template file was not converted to [< >]"; exit 1
          fi
          echo "no stale copier vars ✓"

      - name: tofu validate both rendered infra trees (per cloud)
        # `tofu validate` resolves module references + provider schemas — it catches
        # a live root wired to an output the chosen module doesn't expose (which
        # `tofu fmt` structurally cannot see). init -backend=false pulls providers +
        # local modules without touching remote state. Both clouds, both envs.
        run: |
          V=1.8.5
          curl -sSfL "https://github.com/opentofu/opentofu/releases/download/v${V}/tofu_${V}_linux_amd64.zip" -o /tmp/tofu.zip
          unzip -oq /tmp/tofu.zip -d /tmp/tofubin && sudo install /tmp/tofubin/tofu /usr/local/bin/tofu
          for d in /tmp/render /tmp/render-do /tmp/render-byo; do
            tofu fmt -recursive "$d/tofu" >/dev/null   # normalize (parse check)
            for env in staging prod; do
              echo "== validate $d/$env =="
              ( cd "$d/tofu/live/$env" && tofu init -backend=false -input=false >/dev/null && tofu validate )
            done
          done

      - name: Install kubeconform + kustomize (pinned)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          sudo install kubeconform /usr/local/bin/
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.4.3
          sudo mv kustomize /usr/local/bin/

      - name: kubeconform rendered manifests (caps-off + caps-on + frontend-static + baremetal)
        run: |
          for d in /tmp/render /tmp/render-caps /tmp/render-fe /tmp/render-byo; do
            kubeconform -strict -summary -kubernetes-version 1.31.4 -ignore-missing-schemas \
              -schema-location default -schema-location "$SCHEMA" "$d/clusters"
          done

      - name: kubeconform rendered kustomize overlays (caps-off + caps-on + frontend-static)
        run: |
          for base in /tmp/render /tmp/render-caps /tmp/render-fe; do
            # overlays/* are the deployable app targets; preview/base is referenced
            # directly by the cap_preview_envs ApplicationSet (no overlay), so build
            # it too or a broken resources: ref there rots silently.
            for k in $(find "$base/clusters/apps" -type f -name kustomization.yaml \
                        \( -path '*/overlays/*' -o -path '*/preview/base/*' \)); do
              echo "== $(dirname "$k") =="
              kustomize build "$(dirname "$k")" | kubeconform \
                -strict -summary -kubernetes-version 1.31.4 -ignore-missing-schemas \
                -schema-location default -schema-location "$SCHEMA" -
            done
          done
