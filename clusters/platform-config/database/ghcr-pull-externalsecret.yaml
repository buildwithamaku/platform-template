# NAMESPACE PREREQ (wave 6, with the data ns): created BEFORE the backend app
# (wave 11) so its PreSync migration Job can pull. ghcr is private (org policy blocks public packages), so the cluster needs a
# pull credential. ESO builds a dockerconfigjson Secret from a GitHub token in
# Infisical — no registry creds ever committed. Referenced via imagePullSecrets
# on the Deployment + migration Job.
#
# Infisical (/refclient): GHCR_USERNAME = a GitHub username with package read,
# GHCR_PULL_TOKEN = a PAT with read:packages (or fine-grained packages:read).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: GHCR_USERNAME
    - secretKey: token
      remoteRef:
        key: GHCR_PULL_TOKEN
