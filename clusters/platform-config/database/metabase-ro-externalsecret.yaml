# Password for the CNPG-managed `metabase_ro` role on the product DB (Phase 7).
# ESO builds a basic-auth Secret from Infisical; CNPG's managed.roles reads it to
# set the role's password (see cluster.yaml). The Secret's `username` MUST equal
# the role name (`metabase_ro`) — CNPG validates that.
#
# Infisical (/refclient): METABASE_PRODUCT_DB_RO_PASSWORD = a strong random string.
#
# COUPLING (runbook): if this key is MISSING from Infisical, this Secret never
# syncs, CNPG can't reconcile the metabase_ro managed role, the metabase-ro-grants
# Job exhausts its backoffLimit, and the *database* app (not just BI) goes
# Degraded. Ensure this key exists before/with enabling Metabase.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metabase-ro-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: metabase-ro-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: metabase_ro
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: METABASE_PRODUCT_DB_RO_PASSWORD
