# Cluster-wide gateway from Infisical Cloud -> Kubernetes Secrets (D-04, §5.3).
# Authenticates with the single machine-identity credential planted by
# bootstrap.sh (Secret infisical-universal-auth in the external-secrets ns).
# Every ExternalSecret in the cluster references this store by name.
#
# BEFORE FIRST USE: replace __INFISICAL_PROJECT_SLUG__ with your Infisical
# project slug (Project Settings -> copy the slug). It is not a secret, so it
# is committed here; the client ID/secret are NOT.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://app.infisical.com/api
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            key: clientId
            namespace: external-secrets
          clientSecret:
            name: infisical-universal-auth
            key: clientSecret
            namespace: external-secrets
      secretsScope:
        projectSlug: __INFISICAL_PROJECT_SLUG__
        environmentSlug: staging
        secretsPath: /refclient/staging
        recursive: true
