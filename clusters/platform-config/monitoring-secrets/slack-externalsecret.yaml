# Slack incoming-webhook URL for Alertmanager, delivered by ESO from Infisical
# (SLACK_WEBHOOK_URL at /refclient). Alertmanager mounts this secret and reads
# the webhook from a file (api_url_file), so the URL never lands in the config.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-slack
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: alertmanager-slack
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: SLACK_WEBHOOK_URL
