# OAuth credentials the Tailscale operator uses to mint auth keys and register
# tailnet devices. ESO -> Infisical; the operator reads the `operator-oauth`
# Secret (fixed name the chart expects) with keys client_id / client_secret. We
# pre-create it here so the Helm chart doesn't carry the secret in git.
#
# TAILSCALE SETUP (one-time, admin console): create an OAuth client with the
# `Devices Core` + `Auth Keys` write scopes, tagged `tag:k8s-operator`; define
# tags `tag:k8s-operator` and `tag:k8s` in the tailnet ACL policy (the operator
# tags the devices it creates `tag:k8s`). Then in Infisical (/refclient):
#   TS_OAUTH_CLIENT_ID, TS_OAUTH_CLIENT_SECRET
#
# ACCESS CONTROL (do not skip): `tag:k8s` controls device CREATION, not who can
# REACH the exposed UIs. Grafana/ArgoCD still have their own login, but Redis
# Insight does NOT (unauthenticated cache read/write) — so add a grant so only
# admins can reach these devices. Example tailnet ACL:
#   "tagOwners": {
#     "tag:k8s-operator": ["autogroup:admin"],
#     "tag:k8s":          ["tag:k8s-operator"]
#   },
#   "grants": [
#     { "src": ["autogroup:admin"], "dst": ["tag:k8s"], "ip": ["*"] }
#   ]
# Narrow `src` to a dedicated group (e.g. group:platform-admins) as soon as the
# tailnet has anyone beyond you (contractors, teammates, CI nodes).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: TS_OAUTH_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: TS_OAUTH_CLIENT_SECRET
