# ingress-nginx (D-11). Wave 3. On Hetzner the LoadBalancer Service is fulfilled
# by hcloud-cloud-controller-manager -> a real Hetzner LB (see the CCM in the
# tofu k3s module). On k3d the Service stays <pending> (no CCM) — the controller
# still runs, which is all we validate locally.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      values: |
        controller:
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
            annotations:
              # Consumed by hcloud CCM to provision + shape the Hetzner LB.
              load-balancer.hetzner.cloud/name: refclient-staging-ingress
              load-balancer.hetzner.cloud/location: nbg1
              load-balancer.hetzner.cloud/use-private-ip: "true"
              load-balancer.hetzner.cloud/uses-proxyprotocol: "false"
          ingressClassResource:
            default: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
