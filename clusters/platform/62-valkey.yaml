# Wave 6: Valkey cache + Redis Insight GUI (redisinsight.yaml). Git-sourced (pins
# main — see clusters/README.md). Redis Insight is admin-only: tailnet-exposed via
# the Tailscale operator (D-09), never public ingress.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/buildwithamaku/platform-template.git
    targetRevision: main
    path: clusters/apps/valkey
  destination:
    server: https://kubernetes.default.svc
    namespace: cache
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
