# external-dns (D-11). Wave 3. Watches Ingress resources and writes DNS records
# to Cloudflare (domain delegated there). It reads the Cloudflare API token from
# a Secret delivered by ESO from Infisical (edge-config, wave 4) — so external-dns
# may crashloop until that Secret exists; it self-heals once it lands.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.21.1
    helm:
      values: |
        provider:
          name: cloudflare
        sources:
          - ingress
        policy: sync
        txtOwnerId: refclient-staging
        domainFilters:
          - amakusolutions.com
        env:
          - name: CF_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: cloudflare-api-token
                key: apiToken
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
