# Metrics + Grafana + Alertmanager (D-08). Wave 8. Grafana is THE single pane:
# it gets Loki + Tempo as datasources, cross-linked by trace_id (logs->traces)
# and trace->logs, so the §6.5 2am chain works in one UI. Exemplars on.
# Grafana exposure is Tailscale-only (D-09, deferred) -> port-forward for now.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.19.0
    helm:
      values: |
        crds:
          enabled: true
        # k3s embeds these control-plane components instead of exposing them as
        # separate scrape targets, so their default *Down alerts false-fire
        # forever. Disable the monitors/rules (also true for managed EKS).
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeProxy: { enabled: false }
        kubeEtcd: { enabled: false }
        prometheus:
          prometheusSpec:
            retention: 3d
            enableFeatures: ["exemplar-storage"]
            # Scrape ServiceMonitors/PodMonitors/Rules from ALL namespaces
            # (CNPG, ingress-nginx, apps), not just those with the release label.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            # Persist metrics across pod restarts (default is emptyDir -> data
            # evaporates on reschedule). Size >= retention's working set.
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi
            resources:
              requests: { cpu: 100m, memory: 400Mi }
              limits: { memory: 1Gi }
        alertmanager:
          alertmanagerSpec:
            # Mount the ESO-delivered Slack webhook (read via api_url_file below).
            # SHARP EDGE (runbook): this secret is a hard dependency — if
            # SLACK_WEBHOOK_URL is missing from Infisical, the secret is never
            # created and Alertmanager stays in ContainerCreating (no alerting at
            # all, not just no Slack). Onboarding a client must set it, or drop
            # this mount + the slack receivers until it's provisioned.
            secrets:
              - alertmanager-slack
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }
          # Two tiers: critical -> pages (loud), everything else -> tickets.
          # {{ }} here are Alertmanager templates, preserved verbatim by the chart.
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: slack-tickets
              group_by: ["alertname", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: "null"
                  matchers: ['alertname = "Watchdog"']
                - receiver: slack-pages
                  matchers: ['severity = "critical"']
            receivers:
              - name: "null"
              - name: slack-tickets
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
                    channel: "#alerts"
                    send_resolved: true
                    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
                    text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
              - name: slack-pages
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
                    channel: "#alerts"
                    send_resolved: true
                    title: ':rotating_light: PAGE [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
                    text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
        grafana:
          # Tailscale-only access (D-09): a tailscale-class Ingress publishes Grafana
          # to the tailnet as https://grafana (operator-provisioned TLS — uniform
          # with argocd/redisinsight). No public ingress. root_url is set so Grafana
          # generates correct absolute links/redirects behind MagicDNS.
          ingress:
            enabled: true
            ingressClassName: tailscale
            hosts:
              - grafana
            tls:
              - hosts:
                  - grafana
          grafana.ini:
            server:
              root_url: "https://grafana/"
          defaultDashboardsTimezone: browser
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
              label: grafana_dashboard
            datasources:
              enabled: true
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc:3100
              jsonData:
                derivedFields:
                  # Pull trace_id out of structured JSON logs and link to Tempo.
                  - name: TraceID
                    matcherType: regex
                    matcherRegex: '"trace_id":"(\w+)"'
                    datasourceUid: tempo
                    # $$ so Grafana's provisioning env-interpolation leaves a
                    # literal ${__value.raw} for the derived-field engine.
                    url: '$${__value.raw}'
            - name: Tempo
              type: tempo
              uid: tempo
              url: http://tempo.monitoring.svc:3200
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                serviceMap:
                  datasourceUid: prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
