# cert-manager (D-11). Wave 2: installs its CRDs before the ClusterIssuers and
# the demo Ingress's cert request (edge-config, wave 4) need them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.0
    helm:
      values: |
        crds:
          enabled: true
        # Resolve the DNS-01 self-check against public resolvers instead of the
        # cluster's CoreDNS. Best practice for DNS-01 (avoids split-horizon /
        # internal-DNS flakiness) and required on k3d, whose CoreDNS SERVFAILs
        # on external lookups.
        extraArgs:
          - --dns01-recursive-nameservers-only
          - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
