apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/part-of: refclient
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
        app.kubernetes.io/part-of: refclient
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: demo-api
          image: python:3.12-slim
          command: ["python", "-u", "/app/demo.py"]
          env:
            # §5.4: the OTel endpoint is injected, apps don't hardcode the backend.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.monitoring:4318
          ports:
            - { containerPort: 8080, name: metrics }
          volumeMounts:
            - { name: src, mountPath: /app }
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: src
          configMap:
            name: demo-api-src
