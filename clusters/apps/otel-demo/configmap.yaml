# Synthetic "demo-api": a reference workload that meets the §5.4 contract —
# structured JSON logs to stdout (level/msg/trace_id), OTLP spans to the
# collector (same trace_id), and a /metrics endpoint. It fakes requests with a
# ~20% error rate so the whole observability chain has real, correlated data:
# metric -> alert -> log (trace_id) -> trace -> span.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-api-src
  namespace: demo
data:
  demo.py: |
    import json, os, time, random, secrets, urllib.request, threading
    from http.server import BaseHTTPRequestHandler, HTTPServer

    SERVICE = "demo-api"
    OTLP = os.environ.get("OTEL_EXPORTER_OTLP_ENDPOINT",
                          "http://otel-collector-opentelemetry-collector.monitoring:4318")
    counts = {}
    lock = threading.Lock()

    class Metrics(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics":
                self.send_response(404); self.end_headers(); return
            with lock:
                out = ["# TYPE http_requests_total counter"]
                for (route, status), n in counts.items():
                    out.append('http_requests_total{route="%s",status="%s"} %d' % (route, status, n))
            body = ("\n".join(out) + "\n").encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a):
            pass

    def serve():
        HTTPServer(("0.0.0.0", 8080), Metrics).serve_forever()

    def send_span(trace_id, span_id, name, start_ns, end_ns, error):
        span = {"traceId": trace_id, "spanId": span_id, "name": name, "kind": 2,
                "startTimeUnixNano": str(start_ns), "endTimeUnixNano": str(end_ns)}
        if error:
            span["status"] = {"code": 2, "message": "upstream 500"}
        payload = {"resourceSpans": [{"resource": {"attributes": [
            {"key": "service.name", "value": {"stringValue": SERVICE}}]},
            "scopeSpans": [{"spans": [span]}]}]}
        try:
            req = urllib.request.Request(OTLP + "/v1/traces",
                data=json.dumps(payload).encode(),
                headers={"Content-Type": "application/json"})
            urllib.request.urlopen(req, timeout=5).read()
        except Exception as e:
            print(json.dumps({"level": "warn", "msg": "otlp export failed",
                              "error": str(e), "service": SERVICE}), flush=True)

    threading.Thread(target=serve, daemon=True).start()
    routes = ["GET /", "GET /products", "POST /checkout", "GET /cart"]
    print(json.dumps({"level": "info", "msg": "demo-api started",
                      "service": SERVICE, "otlp": OTLP}), flush=True)
    while True:
        trace_id = secrets.token_hex(16)
        span_id = secrets.token_hex(8)
        route = random.choice(routes)
        start = time.time_ns()
        dur = random.uniform(0.005, 0.25)
        time.sleep(dur)
        end = time.time_ns()
        error = random.random() < 0.2
        status = 500 if error else 200
        with lock:
            counts[(route, str(status))] = counts.get((route, str(status)), 0) + 1
        print(json.dumps({
            "level": "error" if error else "info",
            "msg": (route + " failed: upstream returned 500") if error else (route + " ok"),
            "trace_id": trace_id, "span_id": span_id, "service": SERVICE,
            "http_status": status, "duration_ms": round(dur * 1000, 1), "route": route,
        }), flush=True)
        send_span(trace_id, span_id, route, start, end, error)
        time.sleep(random.uniform(0.3, 1.5))
