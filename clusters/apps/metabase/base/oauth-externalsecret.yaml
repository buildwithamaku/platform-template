# OAuth credentials for the oauth2-proxy SSO gate. ESO -> Infisical, no secrets in
# git. cookie-secret must be a 16/24/32-byte value (generate with
# `openssl rand -base64 32`).
#
# Infisical (/refclient):
#   METABASE_OAUTH_CLIENT_ID     — OIDC app client id (agency Google OIDC app)
#   METABASE_OAUTH_CLIENT_SECRET — OIDC app client secret
#   METABASE_OAUTH_COOKIE_SECRET — random 32-byte base64 cookie-signing secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: metabase-oauth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: metabase-oauth
  data:
    - secretKey: client-id
      remoteRef:
        key: METABASE_OAUTH_CLIENT_ID
    - secretKey: client-secret
      remoteRef:
        key: METABASE_OAUTH_CLIENT_SECRET
    - secretKey: cookie-secret
      remoteRef:
        key: METABASE_OAUTH_COOKIE_SECRET
