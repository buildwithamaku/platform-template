apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metabase
resources:
  - ../../base
  - ingress.yaml
# Per-env OAuth redirect URL (must match the OIDC app's authorized redirect URI).
# Inlined (not a separate partial-Deployment file) so raw kubeconform doesn't try
# to validate a fragment as a standalone Deployment.
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oauth2-proxy
      spec:
        template:
          spec:
            containers:
              - name: oauth2-proxy
                env:
                  - name: OAUTH2_PROXY_REDIRECT_URL
                    value: https://bi.staging.amakusolutions.com/oauth2/callback
  # Staging is a single node: 2 CNPG instances give no real HA (both land on the
  # same node via preferred anti-affinity) and just double the memory footprint on
  # an already-tight node. Run one. Prod keeps the base's 2 for real HA.
  - patch: |-
      apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      metadata:
        name: metabase-db
        namespace: metabase
      spec:
        instances: 1
