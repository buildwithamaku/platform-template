# Prod PostSync smoke gate (§6.2 / Phase-7 acceptance). After ArgoCD syncs prod,
# this runs the @smoke pack against the freshly-rolled backend Service. If it
# fails, the SYNC fails -> the previous ReplicaSet keeps serving, and the failed
# Job trips the Backend*SmokeFailed PrometheusRule -> Slack (page). Same e2e image
# as staging; args select the @smoke subset. Runs in `data` (uses ghcr-pull).
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-smoke
  namespace: data
  labels:
    app.kubernetes.io/name: backend-smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-smoke
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node user in node:20-slim
      containers:
        - name: smoke
          image: ghcr.io/buildwithamaku/refclient-e2e
          args: ["--grep", "@smoke"]
          env:
            - { name: BASE_URL, value: "http://backend.data.svc" }
            - { name: CI, value: "true" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
