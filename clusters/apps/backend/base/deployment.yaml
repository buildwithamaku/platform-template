# Reference backend Deployment. Consumes DATABASE_URL from the CNPG-generated
# app secret (refclient-db-app.uri) — the §5.4 contract, source-swappable. The
# reloader annotation rolls it when that secret rotates. Image TAG is set by the
# overlay (bumped by CI); base leaves it bare.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: refclient
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: refclient
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: ghcr.io/buildwithamaku/refclient-backend
          ports:
            - { containerPort: 8080, name: http }
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: refclient-db-app
                  key: uri
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.monitoring:4318
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: 25m, memory: 48Mi }
            limits: { memory: 128Mi }
