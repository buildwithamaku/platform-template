# Restores §6.5 SLO alert coverage (the otel-demo carried the only one). Fires on
# a real 5xx burn from the backend's own metric — unlike the demo, only on genuine
# errors, so it doesn't page in steady state. Critical -> Alertmanager slack-pages.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  groups:
    - name: backend.slo
      rules:
        - alert: Backend5xxHighErrorRate
          expr: |
            sum(rate(http_requests_total{route!="",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{route!=""}[5m])) > 0.10
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: backend 5xx error rate above 10%
            description: 'backend is returning 5xx for >10% of requests over 5m. Logs: {app="backend"} |= "error" — click the trace_id through to Tempo.'
    - name: backend.e2e
      rules:
        # A failed PostSync e2e/smoke Job means the just-applied version is bad and
        # is ALREADY LIVE (PostSync runs after the rollout). This pages so a human
        # `git revert`s the tag — detection + revert, not prevention. NOTE: an
        # ImagePullBackOff of the e2e image also fails the Job and fires this, which
        # is a tooling problem, not a bad app deploy — check the Job's pod status
        # (ImagePullBackOff vs test failures) before reverting.
        - alert: BackendPostDeploySmokeFailed
          expr: |
            max by (namespace, job_name) (
              kube_job_status_failed{namespace="data", job_name=~"backend-(smoke|e2e).*"}
            ) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: backend post-deploy e2e/smoke failed
            description: 'A backend PostSync e2e/smoke Job failed — the just-deployed version is bad and is LIVE (PostSync runs post-rollout). Action: git revert the tag bump. First rule out tooling: kubectl -n data get pods -l app.kubernetes.io/name=backend-smoke (ImagePullBackOff = e2e image problem, not a bad app deploy); logs: kubectl -n data logs job/backend-smoke (or backend-e2e).'
