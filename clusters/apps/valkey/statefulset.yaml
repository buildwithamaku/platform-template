# Valkey (D-05 cache) — the BSD-licensed Redis fork. Plain StatefulSet on the
# official image (no Bitnami). Single instance with AOF persistence: enough for
# staging. Prod HA (Valkey Sentinel/cluster) + AUTH via ESO are a follow-up;
# for now it's ClusterIP-only (never publicly exposed).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey
  namespace: cache
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/part-of: refclient
spec:
  serviceName: valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/part-of: refclient
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          args: ["--appendonly", "yes", "--dir", "/data"]
          ports:
            - { containerPort: 6379, name: valkey }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["valkey-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 256Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
