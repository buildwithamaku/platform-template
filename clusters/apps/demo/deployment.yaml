# Dummy consumer for the Phase-2 acceptance test. Reads GREETING from the
# ESO-managed Secret as an env var. The reloader annotation makes Stakater
# Reloader rolling-restart this Deployment whenever demo-secret changes, so a
# value edited in the Infisical UI reaches the pod hands-off in ~90s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: demo
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: demo
    app.kubernetes.io/part-of: refclient
    env: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo
        app.kubernetes.io/part-of: refclient
        env: staging
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - 'echo "[$(date -Iseconds)] GREETING=$GREETING"; while true; do sleep 3600; done'
          env:
            - name: GREETING
              valueFrom:
                secretKeyRef:
                  name: demo-secret
                  key: GREETING
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
