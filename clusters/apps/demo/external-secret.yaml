# Pulls GREETING (under /refclient, staging env) from Infisical into a Secret named
# "demo-secret". ESO refreshes every 60s (§6.4); on change the Secret updates
# and Reloader restarts the consuming Deployment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-secret
  namespace: demo
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: demo-secret
    creationPolicy: Owner
  data:
    - secretKey: GREETING
      remoteRef:
        key: GREETING
